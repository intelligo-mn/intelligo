name: Release

# Publishes every public package to npm when main, or the release/X.Y
# branch the run came from, carries a version npm does not have yet.
#
# A release is one commit, squash-merged from a `chore(release)` pull
# request: bump every packages/*/package.json to the new version and
# head CHANGELOG.md with a section for it. The pull request's "Release
# dry run" check (release-dry-run.yml) runs every check below before
# the merge. Once CI has passed on the release commit, this workflow
# builds, runs the full suite, packs each package and publishes it,
# tags the release commit `vX.Y.Z` and creates a GitHub release whose
# notes are that CHANGELOG section. Nothing here is a second source of
# truth: the version is what the manifests say, the notes are what the
# changelog says.
#
# There is no npm token. Every @intelligo-dev package names this file,
# in the `npm` environment of intelligo-dev/intelligo, as its trusted
# publisher; npm checks the run's OIDC identity at publish time and
# attaches provenance. The registry work OIDC cannot do — deprecating
# a folded package, and moving a dist-tag while npm accepts the OIDC
# identity for `publish` only — is scripts/npm-maintain.mjs, which a
# maintainer runs. After a stable release the publish job says on the
# run when `next` is behind `latest`.
#
# Four jobs, each holding only what it needs. `verify`
# (release-verify.yml, shared with the dry run) installs, builds and
# tests with a read-only token and packs the tarballs; `publish` holds
# the OIDC identity and runs no install, build or test — it publishes
# the packed tarballs; `release` holds the write token and runs only
# `gh` against the API to tag and release; `deploy-site` redeploys
# intelligo.dev.
#
# What ships is the release commit's own tree: the commit that set the
# manifests' version, on main, with a green CI run. Whichever run gets
# there — the release commit's own, or a later commit's when the
# release commit's run was cancelled or failed — builds and publishes
# that commit, never whatever main has become.
#
# Pushing a `v*` tag by hand still works and is the fallback; the tag
# must equal the manifests' version and point at the release commit.
#
# The npm dist-tag follows the version: `1.3.0-next.2` publishes under
# `next`, `1.3.0-rc.1` under `rc`, and a plain version under `latest`
# (scripts/release-version.mjs). A prerelease therefore never becomes
# what a bare `npm install` resolves to. Before publishing, a version
# that would move its tag backwards is refused.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # A release/X.Y branch publishes the stable line's patches while
    # main carries the next minor. workflow_run always runs this file as
    # main has it, so the `npm` environment's branch rule is unchanged.
    branches: [main, "release/**"]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One release at a time, and never cancelled halfway through a publish.
# A queued run can still replace another queued one; every run builds
# the release commit, so the one that survives publishes the same tree.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build, test and pack
    # A green CI run for a push to main or a release/X.Y branch, a version
    # tag, or a manual run from main. Any other branch or a pull request
    # cannot reach the publish.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      actions: read # the release commit's CI result
    uses: ./.github/workflows/release-verify.yml
    with:
      mode: publish
      # The commit CI passed; release-verify.yml checks it is on main or
      # the release/X.Y branch the run came from before reading anything
      # from it.
      head-sha: ${{ github.event.workflow_run.head_sha }}
      # The branch CI ran on; release-verify.yml accepts only main or
      # release/X.Y. Empty for a tag push, which it looks up.
      branch: ${{ github.event.workflow_run.head_branch }}
    secrets:
      PRIVATE_VOCABULARY: ${{ secrets.PRIVATE_VOCABULARY }}

  publish:
    name: Publish to npm
    needs: verify
    if: needs.verify.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    # The OIDC identity npm trusts, and nothing else: no checkout, no
    # install, no build — only the tarballs verify packed.
    permissions:
      id-token: write # npm trusted publishing and provenance

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships 10.
      - run: npm install -g --ignore-scripts npm@11.19.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # In dependency order, each under the version's dist-tag. A version
      # already on the registry is skipped, so a re-run after a partial
      # failure is safe.
      - name: Publish
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          while read -r name; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already on npm"
              continue
            fi
            npm publish "$out/$name"/*.tgz --access public --tag "$DIST_TAG"
          done < "$out/order.txt"

      # A minor is promoted by publishing the tree `next` carried as a
      # plain X.Y.0 under `latest`, which leaves `next` on the last
      # X.Y.0-next.N, below `latest`. npm accepts this run's OIDC identity
      # for `publish` only, so moving `next` is the maintainer's; this
      # step reads the tags and, when `next` is behind, says so on the
      # run with the command to run.
      - name: Is next behind latest?
        if: "!contains(needs.verify.outputs.version, '-')"
        timeout-minutes: 2
        # A reminder: npm failing to answer must not skip the tag and the
        # GitHub release of packages already published.
        continue-on-error: true
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          tags=$(npm view @intelligo-dev/core dist-tags --json)
          next=$(node -p 'JSON.parse(process.argv[1]).next ?? ""' "$tags")
          if [ -z "$next" ]; then
            echo "no next tag"
            exit 0
          fi
          # No checkout here: VERSION is plain, so `next` is below it when
          # its X.Y.Z is lower, or equal with a prerelease suffix.
          behind=$(node -e '
            const [a, b] = process.argv.slice(1).map((v) => v.split("-")[0].split(".").map(Number));
            const core = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            console.log(core < 0 || (core === 0 && process.argv[1].includes("-")) ? "yes" : "no");
          ' "$next" "$VERSION")
          if [ "$behind" = "yes" ]; then
            echo "::notice title=next is behind latest::npm next points at $next, below $VERSION. A maintainer runs: node scripts/npm-maintain.mjs"
          else
            echo "next is $next"
          fi

  release:
    name: Tag and GitHub release
    needs: [verify, publish]
    # After a publish, or when everything was already on npm: a release
    # whose run failed after publishing still gets its tag and release
    # on the next run. Never after a failed or skipped-for-error publish.
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only API calls run here (gh, and npm's attestation endpoint): no
    # checkout, no install.
    permissions:
      contents: write # the tag and the GitHub release

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # The tag goes on the release commit — the tree npm shipped — not
      # on whichever commit this run started from. A tag created with
      # GITHUB_TOKEN does not trigger this workflow again; one that
      # exists (a hand-pushed one included) is left as it is.
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.release-sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION exists"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$VERSION" -f "sha=$SHA" >/dev/null
          echo "tagged $SHA as v$VERSION"

      # The SLSA provenance npm attached to each package at publish, copied
      # onto the release so it can be checked in one place: the Sigstore
      # bundle per package (`.sigstore.json`) and the attested statements,
      # one line per package (`.intoto.jsonl`). npm can take a few seconds
      # to serve them after a publish, hence the retries; if it still
      # does not, the release goes out without them.
      - name: Provenance
        if: needs.publish.result == 'success'
        timeout-minutes: 3
        continue-on-error: true
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          slsa='.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1")'
          while read -r name; do
            file="${name#@}"
            curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
              "https://registry.npmjs.org/-/npm/v1/attestations/${name//\//%2f}@$VERSION" > "$work/attestations.json"
            jq -e "$slsa | .bundle" "$work/attestations.json" > "$work/${file//\//-}-$VERSION.sigstore.json"
            jq -c "$slsa | .bundle.dsseEnvelope" "$work/attestations.json" >> "$work/intelligo-dev-$VERSION.intoto.jsonl"
          done < "$RUNNER_TEMP/release/order.txt"
          rm "$work/attestations.json"
          mv "$work" "$RUNNER_TEMP/release/provenance"

      # The release carries the files written for it: an SBOM per package
      # and, after a publish, its provenance. The SBOMs exist only in the
      # run that packed the tarballs, so an existing release gets them
      # only on "Re-run failed jobs" of that same run, which reuses its
      # artifact; a release created on a later run, after npm already had
      # the version, carries none.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            "$RUNNER_TEMP"/release/sbom/*.cdx.json
            "$RUNNER_TEMP"/release/provenance/*.sigstore.json
            "$RUNNER_TEMP"/release/provenance/*.intoto.jsonl
          )
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$VERSION exists"
            if [ "${#assets[@]}" -gt 0 ]; then
              gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            fi
            exit 0
          fi
          prerelease=()
          if [ "$PRERELEASE" = "true" ]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release/notes.md" "${prerelease[@]}" "${assets[@]}"

  # intelligo.dev reads the release npm tags `latest` at build time
  # (apps/website/scripts/serve-release.mjs), and the build Cloudflare ran
  # for the release commit ran before the publish. This one runs after it,
  # from main as Cloudflare would build it, so the site and /r serve the
  # new release without waiting for the next push. The site serves what
  # npm tags `latest`, so a prerelease does not change it and does not
  # redeploy it.
  #
  # A patch from a release/X.Y branch is not on main yet: its pages are
  # built from the tag the release job pushed, so /r serves it at once,
  # and the run warns until a forward-port pull request brings them and
  # the changelog section to main. Until then main has no public/r/X.Y.Z,
  # so main's next site build serves the previous release again.
  deploy-site:
    name: Deploy intelligo.dev
    needs: [verify, publish, release]
    if: needs.publish.result == 'success' && needs.release.result == 'success' && !contains(needs.verify.outputs.version, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERSION: ${{ needs.verify.outputs.version }}
      BRANCH: ${{ needs.verify.outputs.branch }}

    steps:
      - name: Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Deploy intelligo.dev::No CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secret: the site serves $VERSION from its next build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - if: steps.credentials.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — pnpm version from packageManager

      - if: steps.credentials.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - if: steps.credentials.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the release's pages from its tag
        if: steps.credentials.outputs.present == 'true' && startsWith(needs.verify.outputs.branch, 'release/')
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          pnpm registry:build
          node apps/website/scripts/sync-framework.mjs --release "$VERSION"

      - if: steps.credentials.outputs.present == 'true'
        name: Build and deploy
        run: |
          set -euo pipefail
          pnpm turbo build --filter=website
          grep -q "\"published\": \"$VERSION\"" apps/website/src/data/proof.json || {
            echo "::error::The build did not pick up $VERSION from npm."
            exit 1
          }
          pnpm --filter website exec wrangler deploy

      - name: Forward-port
        if: startsWith(needs.verify.outputs.branch, 'release/')
        run: |
          echo "::warning title=Forward-port $VERSION::$VERSION shipped from $BRANCH. Merge the forward-port before any other push to main: until then main's next site build serves the previous release at /r, and main's 'Site sync output is committed' fails until a pull request brings apps/website/public/r/$VERSION and the [$VERSION] changelog section to main: git fetch --tags && git switch -c forward/$VERSION origin/main && pnpm sync, copy the [$VERSION] section from $BRANCH's CHANGELOG.md, commit, and open the pull request."
