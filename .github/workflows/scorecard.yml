name: Scorecard

# OpenSSF Scorecard: scores the repository's supply-chain practices,
# publishes the result to scorecard.dev (the README badge reads it) and
# uploads the findings as code-scanning alerts.
#
# Publishing the result requires this file's shape: a read-only
# top-level token, no top-level env or defaults, and only the steps
# below.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  # Branch-Protection is re-scored when a protection rule changes.
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload to code scanning
      id-token: write # publishing the result to scorecard.dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without a repo_token holding Administration: read, the
      # Branch-Protection check sees only what the default token can.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
