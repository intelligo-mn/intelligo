name: Dependency audit

# Known vulnerabilities, rated high or critical, in what the workspace
# installs for production (devDependencies are not audited). It reads
# the lockfile, so nothing is installed.
#
# A workflow of its own, not a CI job: the release waits for CI on main
# to pass, and an advisory published upstream, unrelated to any commit,
# must not hold back a release. It still fails the pull requests and
# the push to main it runs on, and the weekly run reports one that
# appears between commits.
#
# A fix is an override floor in package.json's pnpm.overrides, scoped to
# the major already in the tree. An advisory with no fixed release, or
# none that can reach code a deployment runs, is accepted by adding its
# GHSA id to pnpm.auditConfig.ignoreGhsas and a line below saying why;
# the entry goes when a fix ships.
#
#   GHSA-vfj7-8cjw-p6xm  braces, no fixed release. Reached only through
#                        shadcn's own file globbing in apps/website's
#                        build, with patterns from its own code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 — pnpm version from packageManager

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
